<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physical AI — Gazebo Simulation</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 80px auto; padding: 0 20px; color: #333; }
    h1 { font-size: 1.4rem; }
    a { color: #0066cc; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin: 20px 0; }
    .btn { display: inline-block; padding: 10px 24px; background: #0066cc; color: #fff; text-decoration: none; border-radius: 4px; }
    .btn:hover { background: #0052a3; }
    code { background: #f4f4f4; padding: 2px 6px; border-radius: 3px; font-size: 0.9em; }
  </style>
</head>
<body>
  <h1>Physical AI - Gazebo Simulation</h1>
  <div class="card">
    <p>Gazebo Harmonic is running with noVNC. Click below to open the 3D view:</p>
    <a class="btn" href="http://localhost:6080" target="_blank">Open Gazebo (noVNC)</a>
  </div>
  <div class="card">
    <p>To add a TurtleBot3 robot into the running simulation:</p>
    <code>podman exec &lt;container-id&gt; /entrypoint-spawn-robot.sh robot_1 -2.0 -0.5 0.0</code>
  </div>
</body>
</html>
